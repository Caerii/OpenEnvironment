[project]
name = "semantic-terrain-server"
version = "0.1.0"
description = "FastAPI terrain generator with heightmap/splatmap outputs"
readme = "../README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "numpy==2.1.1",
  "Pillow==10.4.0",
  "scipy>=1.13.1",
  "noise==1.2.2",
  "cerebras-cloud-sdk>=0.1.0",
  "python-dotenv>=1.0.0",
  "numba>=0.62.1",
]

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

